
- name: Check if Docker is already installed
  command: docker --version
  register: docker_installed
  ignore_errors: yes
  changed_when: false

- name: Add Docker GPG apt key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: yes
  when: docker_installed.rc != 0

- name: Add Docker repo
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu noble stable
    state: present
  become: yes
  when: docker_installed.rc != 0

- name: Install or update docker from Docker repo
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
  become: yes
  notify: restart docker
  when: docker_installed.rc != 0

- name: Create Docker group
  group:
    name: docker
    state: present
  become: yes

- name: Add users to Docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
    state: present
  with_items:
    - "{{ ansible_user }}"
  become: yes
  notify: restart docker

- name: Create docker directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/docker"
    state: directory
    mode: '0755'

- name: Deploy OMERO server configuration
  template:
    src: server_conf.omero.j2
    dest: "{{ ansible_user_dir }}/omero-deployment-kit/docker/server_conf.omero"
    mode: '0644'
  notify: restart omero containers

- name: Create database-biomero directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/database-biomero"
    state: directory
    owner: "{{ postgres_init_uid }}"
    group: "{{ postgres_init_gid }}"
    mode: '0700'
  become: yes

- name: Create metabase data directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/metabase"
    state: directory
    owner: "2000"
    group: "2000"
    mode: '0750'
  become: yes

- name: Create biomero-importer config directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/config/biomero-importer"
    state: directory
    mode: '0755'

- name: Deploy biomero-importer groups_list.json
  copy:
    src: groups_list.json
    dest: "{{ ansible_user_dir }}/omero-deployment-kit/config/biomero-importer/groups_list.json"
    mode: '0644'
  notify: restart omero containers

- name: Ensure SSL certificate files are readable by container users
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/ssl/omero"
    state: directory
    mode: '0755'
  become: yes

- name: Set SSL certificate files world-readable
  shell: "chmod a+r {{ ansible_user_dir }}/omero-deployment-kit/ssl/omero/*"
  become: yes
  failed_when: false

- name: Create log directories for all services
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/logs/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: root
    mode: '0775'
  become: yes
  loop:
    - { path: "omeroserver", owner: "{{ omero_uid | default('1000') }}" }
    - { path: "omeroweb", owner: "999" }
    - { path: "biomero-importer", owner: "{{ vault_biomero_importer_uid | default('1000') }}" }

- name: Create omeroworker-1 log directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/logs/omeroworker-1"
    state: directory
    owner: "{{ omero_uid | default('1000') }}"
    group: root
    mode: '0775'
  become: yes
  when: vault_omero_worker_enabled | default('FALSE') == 'TRUE'

- name: Create biomeroworker log directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/logs/biomeroworker"
    state: directory
    owner: "{{ omero_uid | default('1000') }}"
    group: root
    mode: '0775'
  become: yes
  when: vault_biomero_analyzer_enabled | default('FALSE') == 'TRUE'

- name: Ensure OMERO data directory exists
  file:
    path: "{{ vault_omero_data_path | default('/mnt/omero_data') }}"
    state: directory
    owner: "{{ omero_uid | default('1000') }}"
    group: "{{ omero_uid | default('1000') }}"
    mode: '0750'
  become: yes
  ignore_errors: yes

- name: Deploy biomero-config.json
  copy:
    src: biomero-config.json
    dest: "{{ ansible_user_dir }}/omero-deployment-kit/config/biomero/biomero-config.json"
    mode: '0644'
    force: no
  notify: restart omero containers

- name: Deploy docker-compose configuration
  template:
    src: docker-compose.yml.j2
    dest: "{{ ansible_user_dir }}/omero-deployment-kit/docker/docker-compose.yml"
    mode: '0644'
  notify: restart omero containers
