staging:
  hosts:
    omero-staging:
      ansible_host: local
      ansible_user: local
      ansible_connection: local
      deployment_repo: https://github.com/maartenpaul/omero-deployment-kit.git
      deployment_branch: "claude/add-biomero-uploader-1rEiR"
      server_name: "localhost"
      omero_uid: 1000
      postgres_init_uid: 0
      postgres_init_gid: 0
      # Staging-specific overrides (run parallel to existing NL-BIOMERO)
      vault_container_prefix: "omero-staging"
      vault_omero_data_path: "/mnt/omero_all/omero_repo2" # Copy of production data
      vault_omero_server_port: 4065
      vault_omero_server_ssl_port: 4066
      vault_omero_web_port: 4081

production:
  hosts:
    omero-production:
      ansible_host: local
      ansible_user: local
      ansible_connection: local
      deployment_repo: https://github.com/maartenpaul/omero-deployment-kit.git
      deployment_branch: "lumc"
      server_name: "omero.lumc.nl"
      omero_uid: 1000
      postgres_init_uid: 0
      postgres_init_gid: 0
      # Production settings (after staging validation)
      vault_container_prefix: "omero"
      vault_omero_data_path: "/mnt/omero_data"
      vault_omero_server_port: 4063
      vault_omero_server_ssl_port: 4064
      vault_omero_web_port: 4080
